[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cervnet"
version = "0.1.0"
description = "Research utilities for cervical-spine radiograph analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
ml = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "opencv-python-headless>=4.9",
  "pandas>=2.2",
  "pillow>=10",
  "scikit-learn>=1.4",
  "tensorflow>=2.15",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

